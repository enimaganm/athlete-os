<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#week" aria-label="ATHLETE OS home"><span class="brand-mark" aria-hidden="true">✳</span><span>ATHLETE <span style="color:#7b9a8b">/</span> OS</span></a>
      <nav class="nav" id="main-nav" aria-label="Main navigation"></nav>
      <span class="weekpill" id="week-label">WEEK 01</span>
    </header>
    <main id="app" tabindex="-1"></main>
    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="modal-root"></div>
  <script>
  (()=>{
  'use strict';
  const P=window.WORKOUT_DATA;
  const app=document.getElementById('app');
  const root=document.getElementById('modal-root');
  const weeklabel=document.getElementById('week-label');
  if(!P){app.innerHTML='<section class="info-strip">Workout data missing. Make sure workouts.js is in the same folder as index.html.</section>';return;}
  const $=(s)=>document.querySelector(s);
  const safe=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="m15 18-6-6 6-6"/>',book:'<path d="M12 7c-3-2-6-2-9-1v13c3-1 6-1 9 1 3-2 6-2 9-1V6c-3-1-6-1-9 1Zm0 0v13"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',activity:'<path d="M2 12h4l3-7 4 14 3-7h6"/>',shield:'<path d="M12 22c6-3 8-7 8-13V5l-8-3-8 3v4c0 6 2 10 8 13Z"/>',play:'<path d="m8 5 11 7-11 7V5Z"/>',external:'<path d="M14 3h7v7M10 14 21 3"/><path d="M21 13v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',check:'<path d="m5 12 5 5L20 7"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'};
  const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.info}</svg>`;
  const categories={'Strength':'↟','Power':'↗','Core':'◎','Carry':'▥','Mobility':'◌','Knee care':'◈','Shoulder':'✳','Calisthenics':'✳','Recovery':'◌','Warm-up':'↝'};
  const symbol=(category)=>`<span class="move-symbol ${safe(category.toLowerCase().replace(' ','-'))}" aria-hidden="true">${categories[category]||'✦'}</span>`;
  const navItems=[['week','This week','calendar'],['session','Workout','activity'],['library','Movements','book']];
  let currentSession='built-different', guideIndex=0, currentFilter='All', search='';
  let guideList=[];
  function parse(){let str=decodeURIComponent(location.hash.slice(1))||'week';if(str.startsWith('session/'))return {view:'session',id:str.slice(8)};if(str.startsWith('guide/'))return {view:'guide',id:str.slice(6)};if(str==='library')return {view:'library'};return {view:'week'};}
  function goto(hash){root.innerHTML='';if(location.hash==='#'+hash){render();window.scrollTo(0,0)}else{location.hash=hash;}}
  function nav(view){const items=navItems.map(([key,title,i])=>{let active=key===view;let link=key==='session'?'session/'+currentSession:key;return `<button class="${active?'active':''}" type="button" data-nav="${link}" aria-current="${active?'page':'false'}">${icon(i)}<span>${title}</span></button>`}).join('');$('#main-nav').innerHTML=items;$('#mobile-nav').innerHTML=items;weeklabel.textContent=P.week;}
  function minutesLabel(w){return w.minutes?w.minutes+' MIN':'RECOVERY'}
  function dayCard(w){let disabled=w.category==='Rest';return `<button ${disabled?'disabled':''} class="daycard" ${!disabled?`data-nav="session/${safe(w.id)}"`:''} type="button"><div class="daytop"><span class="daylabel">${safe(w.day)}</span><span class="daytype ${safe(w.category.toLowerCase())}">${safe(w.category)}</span></div><div><h3>${safe(w.name)}</h3><p style="margin-top:10px">${safe(w.focus)}</p></div><div class="cardbottom"><span>${w.minutes?safe(minutesLabel(w)):'TAKE IT EASY'}</span>${disabled?'':`<span class="arr" aria-hidden="true">↗</span>`}</div></button>`}
  function home(){const kb=P.workouts.filter(x=>x.category==='Kettlebell');const rec=P.workouts.filter(x=>x.category==='Recovery');return `<section class="home-hero"><div class="hero-content"><div class="eyebrow">${safe(P.week)} / ${safe(P.weekTitle)}</div><h1>Built for<br>the work<span style="color:var(--accent)">.</span></h1><p class="summary">${safe(P.programNote)}</p><div class="hero-stats"><div class="stat"><strong>${kb.length}</strong><span>KB sessions</span></div><span class="stat-divider"></span><div class="stat"><strong>20–30<span style="font-size:14px;display:inline;color:inherit;letter-spacing:0"> min</span></strong><span>Per KB workout</span></div><span class="stat-divider"></span><div class="stat"><strong>${rec.length}</strong><span>Joint-care options</span></div></div></div></section><section aria-label="Weekly workouts"><div class="section-head"><div><div class="eyebrow">YOUR PLAN</div><h2>Seven days. One direction.</h2></div><span class="heading-sub">Tap a day to view</span></div><div class="daygrid">${P.workouts.map(dayCard).join('')}</div></section><div class="info-strip">${icon('shield')}<div><strong style="color:var(--ink)">Quality before volume.</strong> ${safe(P.trainingNote)}</div></div><p class="footnote">Workout details are available without an account. External demonstration videos and exercise guides require an internet connection.</p>`}
  function moveRow(entry){const ex=P.exercises[entry.id];if(!ex)return '';return `<button class="move" type="button" data-move="${safe(entry.id)}">${symbol(ex.category)}<span class="movetext"><strong>${safe(ex.name)}</strong><span>${safe(entry.dose)}${entry.hint?` · ${safe(entry.hint)}`:''}</span></span><span class="movemore" aria-hidden="true">↗</span></button>`}
  function workout(w){if(w.category==='Rest')return `<button class="back" data-nav="week">${icon('back')} Back to week</button><div class="session-header"><div class="eyebrow">REST DAY</div><h1>${safe(w.name)}</h1><p class="intro">${safe(w.subtitle)}</p></div>`;return `<button class="back" type="button" data-nav="week">${icon('back')} Back to the week</button><section class="session-header"><div class="eyebrow">${safe(w.day.toUpperCase())} / ${safe(w.category)}</div><div class="session-title-wrap"><div><h1>${safe(w.name)}</h1><p class="intro">${safe(w.subtitle)}</p><div class="round-info"><span class="pill">${icon('clock')} ${safe(w.minutes)} min</span><span class="pill">${icon('activity')} ${safe(w.intensity)}</span><span class="pill">${icon('shield')} ${safe(w.focus)}</span></div></div><button class="accent-btn" type="button" data-nav="guide/${safe(w.id)}">${icon('play')} Guide me</button></div></section><div class="focus-note">${icon('info')}<span>${safe(P.trainingNote)}</span></div>${w.blocks.map((b,i)=>`<section class="block" aria-label="${safe(b.title)}"><div class="blockhead"><div class="number">${i+1}</div><div class="blockintro"><div class="time">${safe(b.time)}</div><h2>${safe(b.title)}</h2><p>${safe(b.instructions)}</p>${b.rounds?`<span class="round-tag">${safe(b.rounds)}</span>`:''}</div></div><div class="moves">${b.items.map(moveRow).join('')}</div></section>`).join('')}<p class="footnote">Timing windows are targets, not a reason to rush. If technique or recovery needs extra time, extend the session rather than compress reps.</p>`}
  function modal(id){let ex=P.exercises[id];if(!ex)return;root.innerHTML=`<div class="overlay" data-overlay="true"><section class="sheet" role="dialog" aria-modal="true" aria-label="${safe(ex.name)} coaching details"><div class="sheet-head"><span>COACHING NOTES / ${safe(ex.category).toUpperCase()}</span><button class="xbtn" type="button" data-close="true" aria-label="Close details">×</button></div><div class="sheet-body"><div style="margin-bottom:12px">${symbol(ex.category)}</div><h2>${safe(ex.name)}</h2><p class="lead">${safe(ex.summary)}</p><div class="coach-title">Your three coaching cues</div><ol class="cues">${ex.cues.map((c,i)=>`<li><span class="cue-count">${i+1}</span><span>${safe(c)}</span></li>`).join('')}</ol><div class="coach-box"><strong>Watch out:</strong> ${safe(ex.avoid)}</div><div class="coach-box swap"><strong>Substitution:</strong> ${safe(ex.swap)}</div><div class="video-row"><a href="${safe(ex.video)}" target="_blank" rel="noopener noreferrer">${icon('play')} ${ex.videoIsSearch?'Find video demo':'Watch video demo'} ${icon('external')}</a>${ex.guide?`<a class="alt" href="${safe(ex.guide)}" target="_blank" rel="noopener noreferrer">${icon('book')} ACE exercise guide ${icon('external')}</a>`:''}</div><p class="footnote">External videos open in a new tab. Search links show results for the movement rather than an individually vetted video.</p></div></section></div>`;$('#modal-root .xbtn').focus();}
  function buildGuide(w){guideList=w.blocks.flatMap((b,bi)=>{const total=b.rounds?Math.max(1,parseInt(b.rounds,10)||1):1;return Array.from({length:total},(_,r)=>b.items.map((it,ii)=>({b,bi,entry:it,ii,round:r+1,roundTotal:total}))).flat();});if(guideIndex>=guideList.length||guideIndex<0)guideIndex=0;const entry=guideList[guideIndex];if(!entry)return workout(w);const ex=P.exercises[entry.entry.id];let pct=Math.round((guideIndex+1)/guideList.length*100);return `<div class="guide-screen"><div class="guide-top"><button class="back" style="margin:0" type="button" data-nav="session/${safe(w.id)}">${icon('back')} Full workout</button><span class="guide-step">${guideIndex+1} / ${guideList.length} MOVEMENTS</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Position in workout guide"><div class="progressfill" style="width:${pct}%"></div></div><article class="guide-card"><div class="eyebrow">${safe(entry.b.title)} • ${safe(entry.b.time)}${entry.roundTotal>1?` • ROUND ${entry.round}/${entry.roundTotal}`:''}</div><h1>${safe(ex.name)}</h1><div class="dosebig">${safe(entry.entry.dose)}</div>${entry.entry.hint?`<p class="subtext">${safe(entry.entry.hint)}</p>`:''}<p class="lead">${safe(ex.summary)}</p><div class="coach-title" style="margin-top:27px">Remember as you move</div><div class="guide-cues">${ex.cues.map((c,i)=>`<div class="guide-cue"><i>0${i+1}</i><span>${safe(c)}</span></div>`).join('')}</div><div class="coach-box" style="margin-top:26px"><strong>Don't:</strong> ${safe(ex.avoid)}</div><div class="coach-box swap"><strong>Swap:</strong> ${safe(ex.swap)}</div><div class="guide-links"><a href="${safe(ex.video)}" target="_blank" rel="noopener noreferrer">${icon('play')} ${ex.videoIsSearch?'Find demo video':'Watch demo video'}</a>${ex.guide?`<a href="${safe(ex.guide)}" target="_blank" rel="noopener noreferrer">${icon('book')} ACE guide</a>`:''}<button type="button" data-move="${safe(entry.entry.id)}">All technique notes ↗</button></div></article><div class="guide-blocknote"><strong style="color:var(--ink)">${safe(entry.b.rounds||entry.b.title)}</strong><br>${safe(entry.b.instructions)}<br><span style="color:var(--accent)">This guide includes each programmed round. It does not record completed sets.</span></div><div class="guide-actions"><button class="subtle-btn" type="button" data-prev="true" ${guideIndex===0?'disabled style="opacity:.45"':''}>${icon('back')} Previous</button><button class="accent-btn" type="button" data-next="true">${guideIndex===guideList.length-1?'Back to overview':'Next movement'} ${icon('arrow')}</button></div></div>`}
  function library(){let categories=['All',...new Set(Object.values(P.exercises).map(x=>x.category))];let items=Object.entries(P.exercises).filter(([key,ex])=>(currentFilter==='All'||ex.category===currentFilter)&&(ex.name+' '+ex.category+' '+ex.summary).toLowerCase().includes(search.toLowerCase()));return `<div class="library-top"><div><div class="eyebrow">MOVEMENT LIBRARY / ${Object.keys(P.exercises).length} EXERCISES</div><h1>Move with intent<span style="color:var(--accent)">.</span></h1><p class="muted small">Quick coaching cues, substitutions, and exercise demonstrations.</p></div></div><label class="searchbox">${icon('search')}<input id="search-exercise" type="search" placeholder="Search swings, squats, shoulders…" value="${safe(search)}" autocomplete="off" aria-label="Search exercises"></label><div class="filterbar" style="margin-top:18px">${categories.map(c=>`<button class="filterbtn ${currentFilter===c?'active':''}" type="button" data-filter="${safe(c)}">${safe(c)}</button>`).join('')}</div><div id="library-results">${libraryResults(items)}</div>`}
  function libraryResults(items){return items.length?`<div class="librarygrid">${items.sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([id,ex])=>`<button type="button" class="librarycard" data-move="${safe(id)}">${symbol(ex.category)}<span style="min-width:0;flex:1"><strong>${safe(ex.name)}</strong><span>${safe(ex.category)}</span></span><span class="movemore">↗</span></button>`).join('')}</div>`:'<p class="empty">No movements matched your search.</p>'}
  function render(){root.innerHTML='';const route=parse();let w=route.id&&P.workouts.find(x=>x.id===route.id);if(w&&w.category!=='Rest')currentSession=w.id;if(route.view==='guide'&&!w){goto('week');return;}if(route.view==='session'&&!w){goto('week');return;}app.innerHTML=route.view==='week'?home():route.view==='library'?library():route.view==='guide'?buildGuide(w):workout(w);nav(route.view==='guide'?'session':route.view);document.title=(route.view==='week'?P.weekTitle:route.view==='library'?'Movement Library':w?.name||'ATHLETE / OS')+' | ATHLETE / OS';window.scrollTo({top:0,behavior:'instant'});}
  document.addEventListener('click',(e)=>{const close=e.target.closest('[data-close]');if(close){root.innerHTML='';return;}if(e.target.dataset.overlay==='true'){root.innerHTML='';return;}const nav=e.target.closest('[data-nav]');if(nav){const hash=nav.dataset.nav;if(hash.startsWith('guide/'))guideIndex=0;goto(hash);return;}const mov=e.target.closest('[data-move]');if(mov){modal(mov.dataset.move);return;}const filter=e.target.closest('[data-filter]');if(filter){currentFilter=filter.dataset.filter;const focus=document.activeElement?.id==='search-exercise';app.innerHTML=library();if(focus)$('#search-exercise')?.focus();return;}const prev=e.target.closest('[data-prev]');if(prev){guideIndex=Math.max(0,guideIndex-1);render();return;}const next=e.target.closest('[data-next]');if(next){if(guideIndex>=guideList.length-1){goto('session/'+currentSession)}else{guideIndex++;render()}return;}});
  document.addEventListener('input',(e)=>{if(e.target.id==='search-exercise'){search=e.target.value;let items=Object.entries(P.exercises).filter(([key,ex])=>(currentFilter==='All'||ex.category===currentFilter)&&(ex.name+' '+ex.category+' '+ex.summary).toLowerCase().includes(search.toLowerCase()));$('#library-results').innerHTML=libraryResults(items);}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.innerHTML){root.innerHTML='';return;}if(parse().view==='guide'&&!root.innerHTML){if(e.key==='ArrowRight'&&guideIndex<guideList.length-1){guideIndex++;render()}if(e.key==='ArrowLeft'&&guideIndex>0){guideIndex--;render()}}});
  window.addEventListener('hashchange',render);render();
  })();
  </script>
</body>
</html>
